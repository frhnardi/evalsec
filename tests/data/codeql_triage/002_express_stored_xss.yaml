# tests/data/codeql_triage/002_express_stored_xss.yaml
#
# CodeQL SAST triage case: JavaScript Stored XSS in Express.js.
# User content is reflected in HTML responses. A Content-Security-Policy
# is in place but does not fully mitigate the risk.

id: codeql_triage_002
task: codeql_triage
version: v1

source:
  type: self_scan
  image: comments-service:1.8.3
  scanned_at: 2026-05-14
  codeql_version: 2.18.0
  notes: |
    Scanned locally with CodeQL. The JavaScript security query pack
    detected stored XSS in the comments rendering endpoint. CSP headers
    are configured but with a permissive script-src directive.

