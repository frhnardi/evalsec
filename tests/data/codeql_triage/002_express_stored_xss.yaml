stack_context: |
  Service: comments-service
  Language: TypeScript 5.4 (Express.js 4.18, Node 20)
  Exposure: public internet via CloudFront CDN
  Authentication: Session-based (Redis-backed express-session)
  Data classification: Internal (user-generated content)

  Architecture:
    - Express.js API behind CloudFront with AWS WAF
    - MongoDB Atlas for primary data store
    - Redis 7 for session cache (ElastiCache)
    - CSP header configured: script-src 'self' https://cdn.example.com

  Code analysis:
    - js/xss-through-dom: PARTIALLY PROTECTED. The WAF blocks common XSS
      payloads (<script>, onerror=, etc.) but WAF rules have known bypasses
      (UTF-16 encoding, polyglots). The CSP allows scripts from 'self' and
      one CDN — if an attacker uploads a malicious JS file to the same origin,
      CSP won't prevent execution. This is a real but partially mitigated risk.
    - js/unsafe-deserialization: NOT REACHABLE. The cache key is built from
      internal route parameters, not user input. The cached value is always
      serialized by the application itself, never from an untrusted source.
      However, if Redis is compromised, JSON.parse() on attacker-controlled
      data could lead to prototype pollution.
    - js/missing-rate-limiting: NOT REACHABLE for reading; it's a design
      observation. Rate limiting is handled at the CloudFront/WAF layer
      (1000 req/min per IP), so this is a code-level gap with compensating
      controls.
    - js/request-forgery: PARTIAL. The API uses same-site cookies (Lax mode),
      which mitigates CSRF for state-changing requests. However, DELETE
      without explicit CSRF token violates defense-in-depth.

  Regulatory context: PCI-DSS v4.0 Requirement 6.4 (input/output encoding
  for web apps). OWASP ASVS 2.0 V5 (XSS prevention).

ground_truth:
  exploitable_findings:
    - cve: js/xss-through-dom
      verdict: exploitable
      reasoning: |
        Stored XSS in comment body rendering. While WAF blocks common
        payloads, WAF bypasses exist. CSP allows scripts from 'self' and
        one CDN — insufficient to prevent all XSS variants. User-generated
        content is rendered without sanitization in template literals.
      action: |
        Replace template literal HTML construction with DOMPurify.sanitize():
        const sanitized = DOMPurify.sanitize(comment.body);
        res.send(`<p>${sanitized}</p>`);
        Tighten CSP to script-src 'nonce-{random}' or 'strict-dynamic'.
        Deploy within 72 hours.

  non_exploitable_findings:
    - cve: js/unsafe-deserialization
      verdict: not_exploitable
      reasoning: |
        Cache keys are built from internal parameters, not user input.
        Only application-serialized data passes through JSON.parse().
        No untrusted deserialization path exists. The finding is technically
        correct (JSON.parse of cached data) but the risk is fully mitigated
        by the data flow architecture.
      action: |
        Document in security exception register. No immediate action needed.

    - cve: js/missing-rate-limiting
      verdict: not_exploitable
      reasoning: |
        Rate limiting exists at the CloudFront/WAF layer (1000 req/min/IP).
        The code-level gap is a code quality concern, not a security finding.
        Application-level rate limiting would add defense-in-depth but is
        not critical.
      action: |
        Add express-rate-limit middleware as defense-in-depth next sprint.
        Not a blocker.

  partial_findings:
    - cve: js/request-forgery
      verdict: partial
      reasoning: |
        SameSite=Lax cookies mitigate CSRF for state-changing requests.
        However, DELETE endpoint lacks explicit CSRF token validation.
        Defense-in-depth principle suggests adding CSRF middleware.
      action: |
        Add csurf or similar CSRF token middleware to DELETE endpoints.
        Deploy this sprint.

  priority_order:
    - js/xss-through-dom          # P0 — 72 hours, active bypass risk
    - js/request-forgery          # P2 — this sprint, defense-in-depth
    - js/unsafe-deserialization   # P3 — next quarter (documented exception)
    - js/missing-rate-limiting    # P3 — next quarter (compensated by WAF)

expected_response_includes:
  - "(?i)xss|stored.*xss|DOMPurify|sanitize"
  - "(?i)js/xss-through-dom"
  - "(?i)CSP|Content-Security-Policy|script-src"
  - "(?i)WAF|bypass|partially"
  - "(?i)CSRF|SameSite|request.forgery"

rubric:
  reachability_reasoning:
    max_score: 25
    description: |
      Does the model correctly assess exploitability?
      - XSS is exploitable (WAF bypasses exist, CSP is permissive).
      - Unsafe deserialization is NOT exploitable (internal-only data flow).
      - Rate limiting is NOT exploitable (compensated by WAF layer).
      - CSRF is partial (SameSite=Lax exists, no explicit token).

      Full marks: correctly identifies XSS as the only true exploitable finding.
      Half marks: flags everything as exploitable.
      Zero marks: misses the XSS finding entirely.

  prioritization:
    max_score: 25
    description: |
      Does the model rank findings correctly?
      Expected order: XSS first (P0/72h), then CSRF (this sprint),
      then deserialization and rate limiting (next quarter/deferred).

      Penalize if it puts rate limiting above XSS.
      Bonus if it distinguishes between the WAF-compensated findings.

  actionability:
    max_score: 25
    description: |
      Are actions specific and implementable?
      Good: "Replace template literal with DOMPurify.sanitize() on comment.body."
      Bad: "Sanitize user input."

      Bonus for mentioning CSP nonce or strict-dynamic.

  conciseness:
    max_score: 25
    description: |
      Response is under 15 sentences. No preamble.
      Prioritizes the XSS finding with appropriate detail.

weight: 1.2   # XSS detection — important SAST capability
