stack_context: "Service: product-search-v1\nImage: elasticsearch:7.17.28\nExposure: internal ClusterIP\
  \ on EKS, namespace: search\nContainer runtime: EKS 1.28 with:\n  - writable filesystem (required for\
  \ ES data)\n  - non-root user (uid 1000)\n  - seccomp default profile\n  - Pod Security Standard: baseline\n\
  \  - NetworkPolicy: from api-services namespace only\n  - Volume: 50 gp3 EBS (encrypted at rest)\n\n\
  Usage: Full-text search backend for fintech product catalog.\nX-Pack security with basic auth, TLS NOT\
  \ configured on transport layer\n(known gap, ticket #1023). Stores non-PII product data.\nPCI-DSS adjacent\
  \ (queries reference card brand mapping).\n\nRegulatory context: PCI-DSS adjacent (card brand mappings).\n\
  Credentials in cluster state."
