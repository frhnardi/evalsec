      CVEs must be prioritised over non-exploitable ones. Penalize if the model treats all CRITICAL as
      equally urgent.
  actionability:
    max_score: 25
    description: 'Are recommended actions concrete and specific? Good: ''Patch library X to version Y,
      deploy within 72 hours per OJK 22/2023.'' Bad: ''Update vulnerable dependencies.'''
  conciseness:
    max_score: 25
    description: Response is under 12 sentences. No preamble. No excessive caveats. Direct, professional
      tone.
