stack_context: "Service: customer-api-v2\nImage: node:18 (Debian 11.8)\nExposure:\
  \ internal ClusterIP on EKS, namespace: api-services\nContainer runtime: EKS 1.28\
  \ with:\n  - read-only root filesystem\n  - non-root user (uid 1000)\n  - seccomp\
  \ default profile\n  - capabilities drop ALL\n  - Pod Security Standard: restricted\n\
  \  - NetworkPolicy: ingress from frontend namespace only\n  - emptyDir for /tmp\n\
  \nUsage: Express.js REST API handling customer data.\nLibraries: Express, lodash,\
  \ axios, jsonwebtoken.\ndevDependencies (jest, eslint) installed in image but NEVER\
  \ invoked at runtime.\nStores customer auth tokens in memory.\n\nRegulatory context:\
  \ UU PDP scope. Customer auth tokens are PII."
