ground_truth:
  exploitable_findings:
  - cve: CVE-2022-32221
    verdict: exploitable
    reasoning: curl POST following PUT confusion. Internet-facing ALB forwards HTTP traffic; curl is used
      by the reverse proxy for health checks and upstream requests. An attacker can send specially crafted
      POST-after-PUT sequences to trigger confusion between HTTP methods, leading to request smuggling
      or cache poisoning.
    action: Upgrade curl to 7.64.0-4+deb10u4 immediately. Restrict outbound connections from the Nginx
      container to only known upstream services via egress NetworkPolicy.
    cvss_score: null
    epss_percentile: null
