  - cve: CVE-2018-25009
    verdict: exploitable
    reasoning: Heap buffer overflow in libwebp. As an image-serving reverse proxy, the gateway processes
      HTTP responses containing WebP images. An attacker-controlled upstream could serve a malicious WebP
      image that triggers the overflow.
    action: Upgrade libwebp6 to 0.6.1-2+deb10u1. Validate content-types at the ALB level and strip
      unexpected image formats.
