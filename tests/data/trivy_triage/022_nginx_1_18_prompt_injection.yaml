    internet_facing: null
  - cve: CVE-2021-3711
    verdict: exploitable
    reasoning: SM2 buffer overflow in OpenSSL. The gateway terminates TLS, processing incoming encrypted
      traffic. A malicious client can trigger the overflow during TLS handshake by sending crafted SM2
      cipher data.
    action: Upgrade openssl and libssl1.1 to 1.1.1d-0+deb10u7. Consider using a more recent base image
      as Debian 10.9 is EOL.
